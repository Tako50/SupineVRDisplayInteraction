<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#172033" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#65758b"/>
    </marker>
    <style>
      .title { font-family: "Hiragino Sans"; font-size: 34px; font-weight: 700; fill: #172033; }
      .label { font-family: "Hiragino Sans"; font-size: 22px; font-weight: 600; fill: #344054; }
      .note { font-family: "Hiragino Sans"; font-size: 19px; font-weight: 500; fill: #65758b; }
      .screen { fill: #222831; stroke: #667085; stroke-width: 7; }
      .screen-back { fill: #343b47; stroke: #98a2b3; stroke-width: 7; }
      .target { fill: #00bfff; stroke: #d8f5ff; stroke-width: 5; }
      .panel { fill: #f4f7fb; stroke: #d0d5dd; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1800" height="720" fill="#ffffff"/>

  <!-- Left / Right -->
  <g transform="translate(40,35)">
    <rect class="panel" width="550" height="650"/>
    <text class="title" x="275" y="65" text-anchor="middle">左右配置</text>
    <text class="note" x="275" y="102" text-anchor="middle">Left / Right</text>
    <g filter="url(#shadow)">
      <rect class="screen" x="48" y="205" width="215" height="275" rx="10"/>
      <rect class="screen" x="287" y="205" width="215" height="275" rx="10"/>
    </g>
    <circle class="target" cx="158" cy="335" r="18"/>
    <circle class="target" cx="392" cy="390" r="18"/>
    <text class="label" x="155" y="530" text-anchor="middle">ディスプレイ1</text>
    <text class="label" x="395" y="530" text-anchor="middle">ディスプレイ2</text>
  </g>

  <!-- Up / Down -->
  <g transform="translate(625,35)">
    <rect class="panel" width="550" height="650"/>
    <text class="title" x="275" y="65" text-anchor="middle">上下配置</text>
    <text class="note" x="275" y="102" text-anchor="middle">Up / Down</text>
    <g filter="url(#shadow)">
      <rect class="screen" x="128" y="150" width="294" height="174" rx="10"/>
      <rect class="screen" x="128" y="360" width="294" height="174" rx="10"/>
    </g>
    <circle class="target" cx="285" cy="235" r="18"/>
    <circle class="target" cx="220" cy="445" r="18"/>
    <text class="label" x="445" y="245">上</text>
    <text class="label" x="445" y="455">下</text>
  </g>

  <!-- Up / Down + Depth -->
  <g transform="translate(1210,35)">
    <rect class="panel" width="550" height="650"/>
    <text class="title" x="275" y="65" text-anchor="middle">上下奥行き配置</text>
    <text class="note" x="275" y="102" text-anchor="middle">Up / Down + Depth</text>

    <g filter="url(#shadow)">
      <rect class="screen-back" x="170" y="155" width="245" height="145" rx="10"/>
      <rect class="screen" x="100" y="365" width="350" height="207" rx="12"/>
    </g>
    <circle class="target" cx="300" cy="225" r="16"/>
    <circle class="target" cx="205" cy="470" r="21"/>

    <line x1="455" y1="270" x2="455" y2="390" stroke="#65758b" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M455 398 L444 378 L466 378 Z" fill="#65758b"/>
    <text class="note" x="475" y="328">奥行き差</text>
    <text class="label" x="275" y="330" text-anchor="middle">奥側</text>
    <text class="label" x="275" y="615" text-anchor="middle">手前側</text>
  </g>

  <rect x="500" y="684" width="800" height="30" rx="15" fill="#ffffff"/>
  <text class="note" x="900" y="707" text-anchor="middle">※ターゲットは試行ごとに、いずれか一方のディスプレイに提示される</text>
</svg>
