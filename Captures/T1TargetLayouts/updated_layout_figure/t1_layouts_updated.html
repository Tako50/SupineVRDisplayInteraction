<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=2400, initial-scale=1">
  <title>T1 ディスプレイ配置</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 2400px; height: 1040px; margin: 0; overflow: hidden; }
    body { background: #f7f9fc; color: #172033; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
    h1 { margin: 30px 0 2px; text-align: center; font-size: 42px; line-height: 1.25; }
    .subtitle { margin: 0 0 18px; text-align: center; color: #566176; font-size: 24px; }
    .grid { display: grid; grid-template-columns: repeat(3, 746px); gap: 41px; padding: 0 40px; }
    .card { position: relative; }
    .main-image { width: 746px; height: 582px; object-fit: cover; display: block; border-radius: 12px; box-shadow: 0 8px 24px rgba(15,23,42,.22); }
    .inset { position: absolute; right: 24px; bottom: 118px; width: 300px; height: 240px; padding: 12px; border-radius: 14px; background: white; box-shadow: 0 8px 24px rgba(15,23,42,.3); }
    .inset img { width: 276px; height: 216px; object-fit: cover; border-radius: 10px; display: block; }
    .badge { position: absolute; left: 12px; top: 12px; padding: 7px 15px; background: rgba(23,32,51,.9); color: white; font-size: 19px; font-weight: 700; border-radius: 10px 0 8px 0; }
    h2 { margin: 24px 0 2px; text-align: center; font-size: 38px; line-height: 1.3; }
    .desc { margin: 0; text-align: center; color: #566176; font-size: 23px; }
    .legend { width: 1640px; height: 112px; margin: 38px auto 0; border: 2px solid #8bd9f6; border-radius: 20px; background: #e9f6fc; display: flex; align-items: center; padding: 0 52px; }
    .dot { width: 28px; height: 28px; flex: 0 0 auto; border-radius: 50%; background: #00b8f5; margin-right: 28px; }
    .legend-title { font-size: 25px; font-weight: 700; margin-right: 34px; }
    .legend-text { font-size: 24px; color: #37445a; }
  </style>
</head>
<body>
  <h1>ディスプレイ配置とターゲット候補位置</h1>
  <p class="subtitle">各ディスプレイ：横3列 × 縦2行（合計6点）</p>
  <main class="grid">
    <section class="card">
      <img class="main-image" src="raw/01_left_right_front-1.png" alt="左右配置">
      <h2>左右配置</h2>
      <p class="desc">同じ距離で左右に配置</p>
    </section>
    <section class="card">
      <img class="main-image" src="raw/02_up_down_front.png" alt="上下配置">
      <div class="inset"><img src="raw/03_up_down_oblique.png" alt="上下配置の斜め視点"><span class="badge">斜め視点</span></div>
      <h2>上下配置</h2>
      <p class="desc">同じ距離で上下に配置</p>
    </section>
    <section class="card">
      <img class="main-image" src="raw/04_up_down_depth_front.png" alt="上下奥行き配置">
      <div class="inset"><img src="raw/05_up_down_depth_side.png" alt="上下奥行き配置の側面視点"><span class="badge">側面視点</span></div>
      <h2>上下＋奥行き配置</h2>
      <p class="desc">上下に加えて前後距離を変更</p>
    </section>
  </main>
  <aside class="legend">
    <span class="dot"></span>
    <span class="legend-title">候補位置（正規化座標）</span>
    <span class="legend-text">x = 0.10, 0.50, 0.90　／　y = 0.20, 0.80　／　2ディスプレイで合計12点</span>
  </aside>
</body>
</html>
