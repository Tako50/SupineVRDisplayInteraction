<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1040" viewBox="0 0 2400 1040">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <clipPath id="main1"><rect x="40" y="128" width="746" height="582" rx="12"/></clipPath>
    <clipPath id="main2"><rect x="827" y="128" width="746" height="582" rx="12"/></clipPath>
    <clipPath id="main3"><rect x="1614" y="128" width="746" height="582" rx="12"/></clipPath>
    <clipPath id="inset2"><rect x="1260" y="454" width="276" height="216" rx="10"/></clipPath>
    <clipPath id="inset3"><rect x="2047" y="454" width="276" height="216" rx="10"/></clipPath>
  </defs>

  <rect width="2400" height="1040" fill="#f7f9fc"/>
  <text x="1200" y="66" text-anchor="middle" font-family="Hiragino Sans GB, sans-serif" font-size="42" font-weight="700" fill="#172033">ディスプレイ配置とターゲット候補位置</text>
  <text x="1200" y="105" text-anchor="middle" font-family="Hiragino Sans GB, sans-serif" font-size="24" fill="#566176">各ディスプレイ：横3列 × 縦2行（合計6点）</text>

  <g filter="url(#shadow)">
    <rect x="40" y="128" width="746" height="582" rx="12" fill="#dbe4f0"/>
    <image x="40" y="128" width="746" height="582" preserveAspectRatio="xMidYMid slice" clip-path="url(#main1)" xlink:href="raw/01_left_right_front-1.png"/>
    <rect x="827" y="128" width="746" height="582" rx="12" fill="#dbe4f0"/>
    <image x="827" y="128" width="746" height="582" preserveAspectRatio="xMidYMid slice" clip-path="url(#main2)" xlink:href="raw/02_up_down_front.png"/>
    <rect x="1614" y="128" width="746" height="582" rx="12" fill="#dbe4f0"/>
    <image x="1614" y="128" width="746" height="582" preserveAspectRatio="xMidYMid slice" clip-path="url(#main3)" xlink:href="raw/04_up_down_depth_front.png"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1248" y="442" width="300" height="240" rx="14" fill="#ffffff"/>
    <image x="1260" y="454" width="276" height="216" preserveAspectRatio="xMidYMid slice" clip-path="url(#inset2)" xlink:href="raw/03_up_down_oblique.png"/>
    <rect x="1260" y="454" width="112" height="36" rx="0" fill="#172033" fill-opacity="0.88"/>
    <text x="1316" y="480" text-anchor="middle" font-family="Hiragino Sans GB, sans-serif" font-size="19" font-weight="700" fill="#ffffff">斜め視点</text>

    <rect x="2035" y="442" width="300" height="240" rx="14" fill="#ffffff"/>
    <image x="2047" y="454" width="276" height="216" preserveAspectRatio="xMidYMid slice" clip-path="url(#inset3)" xlink:href="raw/05_up_down_depth_side.png"/>
    <rect x="2047" y="454" width="112" height="36" rx="0" fill="#172033" fill-opacity="0.88"/>
    <text x="2103" y="480" text-anchor="middle" font-family="Hiragino Sans GB, sans-serif" font-size="19" font-weight="700" fill="#ffffff">側面視点</text>
  </g>

  <g font-family="Hiragino Sans GB, sans-serif" text-anchor="middle">
    <text x="413" y="778" font-size="38" font-weight="700" fill="#172033">左右配置</text>
    <text x="413" y="818" font-size="23" fill="#566176">同じ距離で左右に配置</text>

    <text x="1200" y="778" font-size="38" font-weight="700" fill="#172033">上下配置</text>
    <text x="1200" y="818" font-size="23" fill="#566176">同じ距離で上下に配置</text>

    <text x="1987" y="778" font-size="38" font-weight="700" fill="#172033">上下＋奥行き配置</text>
    <text x="1987" y="818" font-size="23" fill="#566176">上下に加えて前後距離を変更</text>
  </g>

  <rect x="380" y="872" width="1640" height="112" rx="20" fill="#e9f6fc" stroke="#8bd9f6" stroke-width="2"/>
  <circle cx="455" cy="928" r="14" fill="#00b8f5"/>
  <text x="492" y="920" font-family="Hiragino Sans GB, sans-serif" font-size="25" font-weight="700" fill="#172033">候補位置（正規化座標）</text>
  <text x="492" y="956" font-family="Hiragino Sans GB, sans-serif" font-size="24" fill="#37445a">x = 0.10, 0.50, 0.90　／　y = 0.20, 0.80　／　2ディスプレイで合計12点</text>
</svg>
